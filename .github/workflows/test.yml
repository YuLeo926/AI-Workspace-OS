name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell-tests-windows:
    name: Windows PowerShell test matrix
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run full suite on Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\run-script-tests.ps1

      - name: Run full suite on PowerShell 7
        shell: pwsh
        run: pwsh -NoProfile -File tests/run-script-tests.ps1

      - name: Validate starter workspace with default policy
        shell: pwsh
        run: pwsh.exe -NoProfile -File scripts\check-workspace.ps1 -Path starter-workspace -ParseSafe

      - name: Validate example workspace with strict policy
        shell: pwsh
        run: pwsh.exe -NoProfile -File scripts\check-workspace.ps1 -Path examples\solo-business-workspace -ParseSafe -Strict

  powershell-tests-ubuntu:
    name: Ubuntu PowerShell 7
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run full suite on PowerShell 7
        shell: pwsh
        run: pwsh -NoProfile -File tests/run-script-tests.ps1

      - name: Validate example workspace with strict policy
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-workspace.ps1 -Path examples/solo-business-workspace -ParseSafe -Strict
